<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="2027届商科校招助手 · AI简历匹配" />
  <title>2027届商科校招助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    :root { --bg: #f8f9fb; --card-bg: #fff; --text: #111827; --text2: #6b7280; --text3: #9ca3af; --border: #e5e7eb; --blue: #2556B6; --orange: #F36440; --green: #2D8A6A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --card-bg: #1a1c24; --text: #e5e7eb; --text2: #9ca3af; --text3: #6b7280; --border: #2a2c34; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    header { margin-bottom: 16px; }
    header h1 { font-size: 26px; font-weight: 700; }
    header h1 span { font-weight: 200; }
    .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
    .tab { padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text2); font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 大类卡片视图 */
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .cat-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 20px; cursor: pointer; transition: all .18s; display: flex; flex-direction: column; gap: 10px; }
    .cat-card:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(37,86,182,0.08); }
    .cat-card__top { display: flex; align-items: center; justify-content: space-between; }
    .cat-card__icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .cat-card__count { font-size: 11px; font-weight: 600; color: var(--text3); }
    .cat-card__name { font-size: 15px; font-weight: 600; }
    .cat-card__examples { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
    .cat-card__ex { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; line-height: 1.4; }
    .cat-card__ex i { font-size: 12px; color: var(--text3); flex-shrink: 0; }
    .cat-card__arrow { margin-top: auto; text-align: right; font-size: 12px; color: var(--blue); font-weight: 500; }

    /* 岗位列表视图 */
    .back-row { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .back-btn:hover { border-color: var(--blue); color: var(--blue); }
    .jobs-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .jobs-title i { font-size: 20px; color: var(--blue); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    #search { flex: 1; min-width: 160px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; background: var(--card-bg); color: var(--text); font-family: inherit; }
    #search:focus { outline: none; border-color: var(--blue); }
    #companyFilter { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 12px; background: var(--card-bg); color: var(--text); font-family: inherit; cursor: pointer; min-width: 140px; }
    #companyFilter:focus { outline: none; border-color: var(--blue); }
    .count { font-size: 12px; color: var(--text3); margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; transition: border-color .15s; }
    .card:hover { border-color: var(--blue); }
    .card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card__title { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .card__company { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .card__tag { font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .card__new { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--orange); color: #fff; letter-spacing: 0.5px; }
    .card__loc { font-size: 11px; color: var(--text2); }
    .card__ft { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
    .card__link { font-size: 11px; color: var(--blue); text-decoration: none; font-weight: 500; }
    .card__link:hover { text-decoration: underline; }
    .card__dl { font-size: 10px; color: var(--text3); }
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty i { font-size: 40px; opacity: 0.4; display: block; margin-bottom: 10px; }
    .empty__text { font-size: 13px; }
    .footer { font-size: 11px; color: var(--text3); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; }

    /* 简历分析 */
    .resume-upload { border: 2px dashed var(--border); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .2s; background: var(--card-bg); }
    .resume-upload:hover { border-color: var(--blue); background: rgba(37,86,182,0.03); }
    .resume-upload.dragover { border-color: var(--blue); background: rgba(37,86,182,0.06); }
    .resume-upload.has-file { border-style: solid; border-color: var(--green); padding: 20px; }
    .upload-icon { font-size: 36px; margin-bottom: 10px; }
    .upload-text { font-size: 14px; color: var(--text2); font-weight: 500; }
    .upload-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
    .match-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 18px; margin-bottom: 12px; }
    .match-card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .match-card__rank { font-size: 28px; font-weight: 700; color: var(--blue); }
    .match-card__score { font-size: 22px; font-weight: 700; }
    .score-high { color: var(--green); } .score-mid { color: var(--orange); }
    .match-card__analysis { font-size: 13px; color: var(--text2); line-height: 1.65; margin-bottom: 8px; }
    .match-card__gap { font-size: 12px; color: var(--orange); background: rgba(243,100,64,0.08); padding: 8px 12px; border-radius: 8px; line-height: 1.5; }
    .summary-box { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--blue); padding: 16px 18px; margin-bottom: 16px; }
    .summary-box__title { font-size: 14px; font-weight: 600; color: var(--blue); margin-bottom: 6px; }
    .summary-box__text { font-size: 13px; color: var(--text2); line-height: 1.7; }
    .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { background: rgba(243,100,64,0.1); color: var(--orange); padding: 12px 16px; border-radius: 10px; font-size: 13px; }
    @media (max-width: 420px) { .cat-grid, .grid { grid-template-columns: 1fr; } header h1 { font-size: 21px; } .tab { padding: 8px 14px; font-size: 13px; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>2027届 · <span>商科校招助手</span></h1>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="board">校招助手</button>
    <button class="tab" data-tab="resume">简历分析</button>
  </div>

  <div class="tab-panel active" id="panel-board">
    <!-- 大类卡片视图（默认） -->
    <div id="category-view">
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <!-- 岗位列表视图 -->
    <div id="jobs-view" style="display:none;">
      <div class="back-row"><button class="back-btn" id="backBtn"><i class="ph ph-arrow-left"></i> 返回全部大类</button></div>
      <div class="jobs-title" id="jobsTitle"></div>
      <div class="toolbar">
        <input id="search" type="text" placeholder="搜索公司、岗位或城市…" />
        <select id="companyFilter"><option value="">🏢 全部公司</option></select>
      </div>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <div class="tab-panel" id="panel-resume">
    <div id="upload-zone" class="resume-upload">
      <div class="upload-icon">📄</div>
      <div class="upload-text">点击上传或拖拽 PDF 简历</div>
      <div class="upload-hint">简历仅在浏览器端解析，不上传至任何服务器（匹配时仅发送纯文本）</div>
      <input type="file" id="file-input" accept=".pdf" style="display:none" />
    </div>
    <div id="resume-preview" style="display:none; margin-top:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:13px; color:var(--text2);" id="file-name"></span>
        <button class="btn btn-outline" id="clear-file" style="padding:6px 14px; font-size:12px;">重新上传</button>
      </div>
      <button class="btn btn-primary" id="btn-match" disabled>
        <span id="btn-match-text">开始匹配分析</span>
      </button>
    </div>
    <div id="match-loading" style="display:none;"></div>
    <div id="match-error" style="display:none;"></div>
    <div id="match-results" style="display:none;"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script>
(function(){
  var DATA = window.CAMPUS_DATA || {};
  var JOBS = DATA.jobs || [];
  var CATEGORIES = DATA.categories || [];
  var UPDATED = DATA.updated || '';

  var MAJOR_COLORS = {
    '财务会计类': {bg:'#EBF0FF', fg:'#2556B6'},
    '金融类': {bg:'#FFF4D9', fg:'#B8860B'},
    '咨询类': {bg:'#E8F4F0', fg:'#2D8A6A'},
    '市场营销类': {bg:'#FFF0E6', fg:'#E07B3C'},
    '商业分析类': {bg:'#E0F2FE', fg:'#0C6B9E'},
    '战略类': {bg:'#FEE8E5', fg:'#A84330'},
    '产品类': {bg:'#F0E8FF', fg:'#6B3FA0'},
    '运营类': {bg:'#E6F0FA', fg:'#1A6094'},
    '人力资源类': {bg:'#FFE8F0', fg:'#C73E6F'},
    '供应链管理类': {bg:'#ECF5E8', fg:'#4A8230'},
    '综合管培生类': {bg:'#E8E6FF', fg:'#4338CA'},
    '审计与税务类': {bg:'#DDE6F5', fg:'#1E40AF'}
  };
  var ICON_BG = {
    '财务会计类': '#EBF0FF', '金融类': '#FFF4D9', '咨询类': '#E8F4F0', '市场营销类': '#FFF0E6',
    '商业分析类': '#E0F2FE', '战略类': '#FEE8E5', '产品类': '#F0E8FF', '运营类': '#E6F0FA',
    '人力资源类': '#FFE8F0', '供应链管理类': '#ECF5E8', '综合管培生类': '#E8E6FF', '审计与税务类': '#DDE6F5'
  };

  var curMajor = null;
  var $catGrid = document.getElementById('catGrid');
  var $catView = document.getElementById('category-view');
  var $jobsView = document.getElementById('jobs-view');
  var $jobsTitle = document.getElementById('jobsTitle');
  var $grid = document.getElementById('grid');
  var $count = document.getElementById('count');
  var $search = document.getElementById('search');
  var $companyFilter = document.getElementById('companyFilter');
  var $footer = document.getElementById('footer');
  var $backBtn = document.getElementById('backBtn');

  function countByMajor(name) { return JOBS.filter(function(j){ return j.major === name; }).length; }

  function renderCategories(){
    $catGrid.innerHTML = CATEGORIES.map(function(cat){
      var n = countByMajor(cat.name);
      var bg = ICON_BG[cat.name] || '#EBF0FF';
      var ex = (cat.examples || []).filter(function(e){ return e; }).slice(0,3).map(function(e){
        return '<div class="cat-card__ex"><i class="ph ph-caret-right"></i>' + e + '</div>';
      }).join('');
      return '<div class="cat-card" data-major="' + cat.name + '">' +
        '<div class="cat-card__top">' +
          '<div class="cat-card__icon" style="background:' + bg + '; color:' + (MAJOR_COLORS[cat.name]||{}).fg + ';"><i class="ph ' + cat.icon + '"></i></div>' +
          '<span class="cat-card__count">' + n + ' 个岗位</span>' +
        '</div>' +
        '<div class="cat-card__name">' + cat.name + '</div>' +
        '<div class="cat-card__examples">' + ex + '</div>' +
        '<div class="cat-card__arrow">查看岗位 <i class="ph ph-arrow-right"></i></div>' +
      '</div>';
    }).join('');

    $catGrid.querySelectorAll('.cat-card').forEach(function(el){
      el.addEventListener('click', function(){ openMajor(this.dataset.major); });
    });
  }

  function openMajor(name){
    curMajor = name;
    $catView.style.display = 'none';
    $jobsView.style.display = 'block';
    var cat = CATEGORIES.find(function(c){ return c.name === name; }) || {};
    $jobsTitle.innerHTML = '<i class="ph ' + (cat.icon || 'ph-folder') + '"></i> ' + name;
    renderFilters();
    renderJobs();
  }

  function renderFilters(){
    var companies = [], seen = {};
    JOBS.filter(function(j){ return j.major === curMajor; }).forEach(function(j){
      if(!seen[j.company]){ seen[j.company]=true; companies.push(j.company); }
    });
    $companyFilter.innerHTML = '<option value="">🏢 全部公司</option>' + companies.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  }

  function renderJobs(){
    var q = $search.value.toLowerCase().trim();
    var cc = $companyFilter.value;
    var jobs = JOBS.filter(function(j){
      if(j.major !== curMajor) return false;
      if(cc && j.company !== cc) return false;
      if(q) return (j.company+j.title+j.location).toLowerCase().indexOf(q)>=0;
      return true;
    });

    $count.textContent = '共 ' + jobs.length + ' 个岗位';

    if(!jobs.length){
      $grid.innerHTML = '<div class="empty"><i class="ph ph-tray"></i><div class="empty__text">该大类暂无岗位，敬请期待</div></div>';
      return;
    }

    $grid.innerHTML = jobs.map(function(j){
      var c = MAJOR_COLORS[j.major] || {bg:'#EBF0FF', fg:'#2556B6'};
      return '<div class="card">' +
        '<div class="card__head">' +
          '<div><div class="card__title">' + j.title + '</div><div class="card__company">' + j.company + '</div></div>' +
          '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">' +
            (j.isNew ? '<span class="card__new">NEW</span>' : '') +
            '<span class="card__tag" style="background:' + c.bg + '; color:' + c.fg + ';">' + j.major + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card__loc">📍 ' + j.location + '</div>' +
        '<div class="card__ft">' +
          '<a class="card__link" href="' + j.url + '" target="_blank" rel="noopener">🔗 官网投递</a>' +
          '<span class="card__dl">' + j.start + ' · ' + j.deadline + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  $backBtn.addEventListener('click', function(){
    curMajor = null;
    $jobsView.style.display = 'none';
    $catView.style.display = 'block';
    renderCategories();
  });
  $search.addEventListener('input', renderJobs);
  $companyFilter.addEventListener('change', renderJobs);

  // ===== 初始化 =====
  if(!JOBS.length || !CATEGORIES.length){
    document.getElementById('category-view').innerHTML = '<div class="error-msg">数据加载失败：找不到 data.js</div>';
  } else {
    $footer.textContent = '最后更新：' + (UPDATED ? new Date(UPDATED).toLocaleString('zh-CN',{hour12:false}) : '—');
    renderCategories();
  }

  // ===== TAB SWITCHING =====
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('panel-'+t.dataset.tab).classList.add('active');
    });
  });

  // ===== RESUME TAB =====
  var resumeText = '';
  var uploadZone = document.getElementById('upload-zone');
  var fileInput = document.getElementById('file-input');
  var resumePreview = document.getElementById('resume-preview');
  var fileNameEl = document.getElementById('file-name');
  var clearBtn = document.getElementById('clear-file');
  var btnMatch = document.getElementById('btn-match');
  var btnMatchText = document.getElementById('btn-match-text');
  var matchLoading = document.getElementById('match-loading');
  var matchError = document.getElementById('match-error');
  var matchResults = document.getElementById('match-results');

  uploadZone.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){ if(e.target.files[0]) processFile(e.target.files[0]); });
  uploadZone.addEventListener('dragover', function(e){ e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', function(){ uploadZone.classList.remove('dragover'); });
  uploadZone.addEventListener('drop', function(e){ e.preventDefault(); uploadZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });
  clearBtn.addEventListener('click', function(){ resumeText=''; fileInput.value=''; resumePreview.style.display='none'; uploadZone.style.display='block'; uploadZone.classList.remove('has-file'); matchResults.style.display='none'; matchError.style.display='none'; btnMatch.disabled=true; });
  btnMatch.addEventListener('click', runMatch);

  async function processFile(file){
    if(file.type!=='application/pdf'){ alert('请上传 PDF 文件'); return; }
    try {
      uploadZone.classList.add('has-file');
      var arrayBuffer = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
      var texts = [];
      for(var i=1;i<=pdf.numPages;i++){
        var page = await pdf.getPage(i);
        var content = await page.getTextContent();
        texts.push(content.items.map(function(item){ return item.str; }).join(' '));
      }
      resumeText = texts.join('\n').trim();
      if(!resumeText){ alert('无法解析简历文本，请确保 PDF 不是扫描图片版'); return; }
      uploadZone.style.display='none';
      resumePreview.style.display='block';
      fileNameEl.textContent = file.name+' ('+resumeText.length+' 字符)';
      btnMatch.disabled=false;
      btnMatchText.textContent='开始匹配分析';
      matchResults.style.display='none';
      matchError.style.display='none';
    } catch(e){ alert('解析失败：'+e.message); }
  }

  async function runMatch(){
    btnMatch.disabled=true;
    btnMatchText.textContent='分析中…';
    matchLoading.style.display='block';
    matchLoading.innerHTML = '<div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--text2);">DeepSeek 正在分析你的简历与 '+JOBS.length+' 个岗位…</div></div>';
    matchError.style.display='none';
    matchResults.style.display='none';

    try {
      var r = await fetch('/api/match', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ resume: resumeText, jobs: JOBS.map(function(j,i){ return {company:j.company, title:j.title, major:j.major, location:j.location, url:j.url, start:j.start, deadline:j.deadline, idx:i}; }) })
      });
      var data = await r.json();
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));

      matchLoading.style.display='none';
      var h = '';
      if(data.summary) h += '<div class="summary-box"><div class="summary-box__title">📊 综合评估</div><div class="summary-box__text">'+data.summary+'</div></div>';

      (data.matches||[]).forEach(function(m,i){
        var job = m.job||{};
        var sc = m.score||0;
        var scCls = sc>=8?'score-high':(sc>=6?'score-mid':'');
        h += '<div class="match-card">'+
          '<div class="match-card__header">'+
            '<div><span class="match-card__rank">#'+(i+1)+'</span> <span style="font-size:15px;font-weight:600;">'+job.title+'</span><div style="font-size:11px;color:var(--text3);margin-top:3px;">'+job.company+' · '+job.location+'</div></div>'+
            '<span class="match-card__score '+scCls+'">'+sc+'/10</span>'+
          '</div>'+
          '<div class="match-card__analysis">'+(m.analysis||'')+'</div>'+
          (m.gap?'<div class="match-card__gap">💡 '+(m.gap||'')+'</div>':'')+
          '<div style="margin-top:8px;"><a class="card__link" href="'+(job.url||'#')+'" target="_blank" rel="noopener">🔗 官网投递</a><span class="card__dl" style="margin-left:12px;">'+job.start+' · '+job.deadline+'</span></div>'+
        '</div>';
      });
      matchResults.innerHTML = h;
      matchResults.style.display='block';
    } catch(e){
      matchLoading.style.display='none';
      matchError.style.display='block';
      var isLocal = window.location.protocol === 'file:';
      matchError.innerHTML = isLocal
        ? '<div class="error-msg">⚠️ 本地预览模式不支持 AI 简历匹配（依赖 EdgeOne 边缘函数后端）。请部署到 EdgeOne 后使用。</div>'
        : '<div class="error-msg">❌ '+e.message+'</div>';
    }
    btnMatch.disabled=false;
    btnMatchText.textContent='重新匹配分析';
  }
})();
</script>
</body>
</html>
